      <nav class="app-nav" aria-label="产品导航">

        <a class="app-nav-link" href="./literature-reader.html">

      <section class="app-sidebar-history" data-history-panel aria-label="对话记录">

              <span data-icon="list-checks"></span>
            </button>
          </div>
          <div class="history-manage-head" data-history-manage-head hidden>
            <span data-history-selection-count>已选择 0 个对话</span>
            <button class="history-icon-button" type="button" data-history-manage-close aria-label="退出管理">
              <span data-icon="x"></span>
            </button>

        </div>
        <div class="history-list">

            <div class="history-group-label">置顶</div>
          </div>
          <div class="history-group">
            <div class="history-group-label">今天</div>
            <div class="history-row">

              <button class="history-more" type="button" data-history-more aria-label="更多操作"><span data-icon="ellipsis"></span></button>
            </div>
            <div class="history-row">
              <button class="history-item" type="button" data-history-item>
                <span class="history-item-text">区域治理研究框架比较</span>
              </button>
              <button class="history-more" type="button" data-history-more aria-label="更多操作"><span data-icon="ellipsis"></span></button>
            </div>
          </div>
          <div class="history-group">
            <div class="history-group-label">近7天</div>
            <div class="history-row">
              <button class="history-item" type="button" data-history-item>
                <span class="history-item-text">公共政策分析中的证据分层</span>
              </button>
              <button class="history-more" type="button" data-history-more aria-label="更多操作"><span data-icon="ellipsis"></span></button>
            </div>
          </div>
        </div>

          <button type="button" data-history-delete disabled><span data-icon="trash-2"></span>删除</button>

      <div class="app-sidebar-foot">

            <div class="user-menu-divider" aria-hidden="true"></div>
            <div class="user-menu-group">

              <a href="./account-center.html" target="_blank" rel="noopener"><span data-icon="user-round"></span><span>账号中心</span><span class="user-menu-arrow"><span data-icon="chevron-right"></span></span></a>
              <button type="button" data-settings-open><span data-icon="settings"></span><span>设置</span></button>
              <button type="button" data-user-menu-toast="帮助与反馈将在后续接入"><span data-icon="message-square"></span><span>帮助与反馈</span></button>
            </div>
            <div class="user-menu-divider" aria-hidden="true"></div>
            <button class="user-menu-logout" type="button" data-auth-logout><span data-icon="log-out"></span><span>退出登录</span></button>
          </div>
        </div>
      </div>
    </aside>
    <div class="app-sidebar-mask" data-app-sidebar-mask hidden></div>

    <div class="app-main">
      <div class="kb-gallery">
        <button class="app-toolbar-btn kb-gallery-menu" type="button" data-app-sidebar-open aria-label="打开产品导航">
          <span data-icon="menu"></span>
        </button>

        <div class="kb-gallery-inner">
          <div class="kb-gallery-hero">
            <button class="kb-personal-entry" type="button" data-kb-personal-open hidden>
              我的知识
            </button>
            <header class="kb-gallery-heading">
              <h1>汇聚知识，让研究持续发生</h1>
              <p>在私有知识社区中保存资料，从社区共享与官方精选中发现研究线索，并随时进入深度研究。</p>
            </header>

            <form class="kb-hero-search" data-kb-search-form>
              <input type="search" placeholder="搜索知识社区" aria-label="搜索知识社区" data-kb-search-input>
              <button class="kb-hero-submit" type="submit" aria-label="搜索">
                <span data-icon="search"></span>
              </button>
            </form>
          </div>

          <div class="kb-gallery-filters" data-kb-main-filters data-kb-filter-group="main" role="tablist" aria-label="知识社区分类">
            <button class="is-active" type="button" data-kb-gallery-filter="community-shared" role="tab" aria-selected="true">社区共享</button>
            <button type="button" data-kb-gallery-filter="official-featured" role="tab" aria-selected="false">官方精选</button>
          </div>

          <div class="kb-personal-view" data-kb-personal-view hidden>
            <div class="kb-personal-heading">
              <button class="kb-personal-back" type="button" data-kb-personal-back>
                <span data-icon="chevron-left"></span>
                返回
              </button>
              <div>
                <h1>我的知识</h1>
                <p>管理私有知识库与已分享内容</p>
              </div>
            </div>
            <div class="kb-personal-toolbar">
              <div class="kb-gallery-filters kb-personal-filters" data-kb-filter-group="personal" role="tablist" aria-label="我的知识分类">
                <button class="is-active" type="button" data-kb-gallery-filter="personal-all" role="tab" aria-selected="true">全部</button>
                <button type="button" data-kb-gallery-filter="mine" role="tab" aria-selected="false">我的</button>
                <button type="button" data-kb-gallery-filter="favorite" role="tab" aria-selected="false">收藏</button>
                <button type="button" data-kb-gallery-filter="shared" role="tab" aria-selected="false">共享</button>
              </div>
              <label class="kb-personal-search">
                <span data-icon="search"></span>
                <input type="search" placeholder="搜索" aria-label="搜索知识卡片" data-kb-personal-search>
              </label>
            </div>
          </div>

              </span>
            </button>

            <button class="kb-gallery-card" type="button" data-kb-card data-kb-id="public-culture" data-kb-name="公共文化政策专题" data-kb-count="84" data-kb-categories="mine recent">

              <span class="kb-card-cover is-governance">

              <span class="kb-card-cover is-results">

      <form class="kb-floating-search" data-kb-search-form data-kb-floating-search aria-hidden="true">

  <div class="kb-modal-mask" data-kb-modal-mask hidden></div>
  <section class="kb-modal" data-kb-create-modal role="dialog" aria-modal="true" aria-labelledby="kbCreateTitle" hidden>
    <div class="kb-modal-head">
      <div>
        <h2 id="kbCreateTitle">新建知识库</h2>
        <p>为一组长期研究资料创建独立空间</p>
      </div>
      <button class="kb-modal-close" type="button" data-kb-modal-close aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <form class="kb-modal-body" data-kb-create-form>
      <label class="kb-field">
        <span>知识库名称</span>
        <input type="text" maxlength="40" placeholder="例如：数字治理专题资料" required data-kb-create-name>
      </label>
      <label class="kb-field">
        <span>用途说明</span>
        <textarea rows="3" maxlength="160" placeholder="说明资料范围和主要研究主题" data-kb-create-description></textarea>
      </label>
      <label class="kb-field">
        <span>访问范围</span>
        <select data-kb-create-privacy>
          <option value="私有">仅自己可见</option>
          <option value="机构">所有人可见</option>
        </select>
      </label>
      <div class="kb-modal-actions">
        <button class="btn btn-outline" type="button" data-kb-modal-close>取消</button>
        <button class="btn btn-primary" type="submit">创建知识库</button>
      </div>
    </form>
  </section>

  <section class="kb-modal kb-card-edit-modal" data-kb-card-edit-modal role="dialog" aria-modal="true" aria-labelledby="kbCardEditTitle" hidden>
    <div class="kb-modal-head">
      <div>
        <h2 id="kbCardEditTitle">编辑知识库</h2>
        <p>修改知识库名称后保存</p>
      </div>
      <button class="kb-modal-close" type="button" data-kb-modal-close aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <form class="kb-modal-body" data-kb-card-edit-form>
      <label class="kb-field">
        <span>知识库名称</span>
        <input type="text" maxlength="40" required data-kb-card-edit-name>
      </label>
      <div class="kb-modal-actions">
        <button class="btn btn-outline" type="button" data-kb-modal-close>取消</button>
        <button class="btn btn-primary" type="submit">保存修改</button>
      </div>
    </form>
  </section>

  <section class="kb-modal kb-card-delete-modal" data-kb-card-delete-modal role="alertdialog" aria-modal="true" aria-labelledby="kbCardDeleteTitle" hidden>
    <div class="kb-modal-head">
      <div>
        <h2 id="kbCardDeleteTitle">删除知识库</h2>
        <p data-kb-card-delete-description></p>
      </div>
      <button class="kb-modal-close" type="button" data-kb-modal-close aria-label="关闭">
        <span data-icon="x"></span>
      </button>
    </div>
    <div class="kb-card-delete-body">
      <p>删除后，该知识库及相关资料将无法恢复。</p>
    </div>
    <div class="kb-modal-actions kb-card-delete-actions">
      <button class="btn btn-outline" type="button" data-kb-modal-close>取消</button>
      <button class="btn btn-primary danger" type="button" data-kb-card-delete-confirm>删除</button>
    </div>
  </section>

  <script src="../assets/js/icons.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>

</body>
