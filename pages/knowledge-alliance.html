<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="workbench-body">
  <div class="workbench-shell">

    <main class="workbench-main" aria-label="操作区域">
      <section class="community-workspace" aria-label="共享社区">
          <div class="community-scroll" data-community-scroll>
            <div class="community-content">
              <header class="community-header" data-community-list-header>
                <button class="app-toolbar-btn community-mobile-menu" type="button" data-app-sidebar-open aria-label="打开产品导航">
                  <span data-icon="menu"></span>
                </button>
                <div class="community-heading">
                  <h1>汇聚共享成果，让研究持续发生</h1>

                <div class="community-header-actions">

                    </button>

                      <span data-icon="search"></span>
                    </button>
                  </div>
                </div>
              </header>
  
              <section class="community-toolbar">
                <div class="community-toolbar-filters">
                  <div class="community-tabs" role="tablist" aria-label="内容范围">
                    <button class="is-active" type="button" role="tab" aria-selected="true" data-community-channel="community">社区共享</button>
                    <button type="button" role="tab" aria-selected="false" data-community-channel="featured">官方精选</button>
                  </div>
                  <section class="community-topic-row" aria-label="主题分类">
                    <button class="is-active" type="button" data-community-topic="all">全部主题</button>
                    <button type="button" data-community-topic="政策研究">政策研究</button>
                    <button type="button" data-community-topic="基层治理">基层治理</button>
                    <button type="button" data-community-topic="区域发展">区域发展</button>
                    <button type="button" data-community-topic="文化传播">文化传播</button>
                    <button type="button" data-community-topic="社会治理">社会治理</button>
                    <button type="button" data-community-topic="成果案例">成果案例</button>
                  </section>
                </div>
                <div class="community-toolbar-actions">
                  <span class="community-select-wrap" data-community-sort-menu>
                    <button class="community-select-button" type="button" data-community-sort-trigger aria-haspopup="listbox" aria-expanded="false">
                      <span data-community-sort-label>最新共享</span>
                      <span data-icon="chevron-down"></span>
                    </button>
                    <span class="community-select-list" data-community-sort-list role="listbox" hidden>
                      <button class="is-selected" type="button" role="option" aria-selected="true" data-community-sort-value="latest">最新共享</button>
                      <button type="button" role="option" aria-selected="false" data-community-sort-value="updated">最近更新</button>
                      <button type="button" role="option" aria-selected="false" data-community-sort-value="downloads">下载较多</button>
                    </span>
                  </span>
                  <span class="community-select-wrap" data-community-type-filter>
                    <button class="community-select-button" type="button" data-community-type-trigger aria-haspopup="listbox" aria-expanded="false">
                      <span data-community-type-label>全部格式</span>
                      <span data-icon="chevron-down"></span>
                    </button>
                    <span class="community-select-list" data-community-type-list role="listbox" hidden>
                      <button class="is-selected" type="button" role="option" aria-selected="true" data-community-type-value="all">全部格式</button>
                      <button type="button" role="option" aria-selected="false" data-community-type-value="PDF">PDF</button>
                      <button type="button" role="option" aria-selected="false" data-community-type-value="DOCX">DOCX</button>
                      <button type="button" role="option" aria-selected="false" data-community-type-value="TXT">TXT</button>
                      <button type="button" role="option" aria-selected="false" data-community-type-value="MD">Markdown</button>
                    </span>
                  </span>
                </div>
              </section>

                    <span class="community-file-mark"><span data-icon="file-pdf"></span></span>

                      <span class="community-card-title"><strong>湖北社科成果知识图谱建设路径.pdf</strong><small class="community-featured-tag">官方精选</small></span>
                      <span class="community-card-description">围绕成果实体、主题关系和研究成果转化路径构建知识图谱。</span>

                      <span class="community-card-footer">下载 542 次</span>

                  <button class="community-card-main" type="button" data-community-open>

                    <span class="community-card-copy">
                      <span class="community-card-title"><strong>数字治理与公共政策协同分析.md</strong></span>
                      <span class="community-card-description">分析数字治理与公共政策协同的主要机制和现实约束。</span>

                      <span class="community-card-footer">下载 98 次</span>

                  <button class="community-card-main" type="button" data-community-open>
                    <span class="community-file-mark"><span data-icon="file-pdf"></span></span>
                    <span class="community-card-copy">
                      <span class="community-card-title"><strong>公共文化空间参与式更新案例.pdf</strong></span>
                      <span class="community-card-description">以公共文化空间为对象，整理参与式更新和社区协作案例。</span>

                      <span class="community-card-footer">下载 132 次</span>

                <article class="community-card" data-community-card data-id="community-06" data-name="城乡公共服务均等化政策综述.docx" data-org="汉江社会科学研究院" data-type="DOCX" data-size="1.8 MB" data-topic="政策研究" data-channel="featured" data-featured="true" data-downloads="418" data-time="09-14 17:40 共享" data-description="系统梳理城乡公共服务均等化的政策演进和研究争议。">

                    <span class="community-file-mark"><span data-icon="file-word"></span></span>
                    <span class="community-card-copy">
                      <span class="community-card-title"><strong>城乡公共服务均等化政策综述.docx</strong><small class="community-featured-tag">官方精选</small></span>

                    </span>
                  </button>
                </article>
              </section>
  
              <div class="community-empty" data-community-empty hidden>
                <h2>暂时没有符合条件的共享文件</h2>
                <p>调整搜索关键词或筛选条件后再试。</p>
                <button class="btn btn-outline" type="button" data-community-reset>重置筛选</button>
              </div>
  
              <button class="community-load-more" type="button" data-community-load-more>加载更多</button>
            </div>
          </div>
  
          <div class="community-floating-search" data-community-floating-search aria-hidden="true">
            <button class="community-search-share" type="button" data-community-share-open data-auth-only hidden aria-label="共享文件">
              <span data-icon="plus"></span>
            </button>
            <input type="search" placeholder="搜索文件名或主题" aria-label="搜索文件名或主题" data-community-search>
            <button class="community-search-submit" type="button" data-community-search-submit aria-label="搜索">
              <span data-icon="search"></span>
            </button>
          </div>
  
          <section class="community-detail" data-community-detail hidden aria-labelledby="communityDetailTitle">
            <div class="community-detail-head">
              <button class="knowledge-back" type="button" data-community-detail-back>
                <span data-icon="chevron-left"></span>返回
              </button>
              <div>
                <h1 id="communityDetailTitle" data-community-detail-title>文件详情</h1>
                <p data-community-detail-meta></p>
              </div>
              <div class="community-detail-actions">
                <button class="btn btn-outline" type="button" data-community-download><span data-icon="download"></span>下载文件</button>
                <button class="btn btn-outline" type="button" data-community-detail-favorite><span data-icon="star"></span>收藏到我的知识</button>
              </div>
            </div>
  
            <div class="community-detail-grid">
              <!-- 预览区整体是链接：新窗口打开该文件的查看页，href 由 shared-community.js 按当前卡片填 -->
              <a class="community-preview" data-community-preview-link href="./reader.html?source=community" target="_blank" rel="noopener">
                <span class="community-preview-icon"><span data-icon="file-text"></span></span>
                <strong data-community-preview-name>共享文件</strong>
                <small data-community-preview-size></small>
                <p>文件预览区域</p>
              </a>
              <article class="community-information">
                <h2>文件信息</h2>
                <dl>
                  <div><dt>主题</dt><dd data-community-detail-topic></dd></div>
                  <div><dt>共享时间</dt><dd data-community-detail-time></dd></div>
                  <div><dt>下载次数</dt><dd data-community-detail-downloads></dd></div>
                </dl>
                <p class="community-information-description" data-community-detail-description></p>
              </article>
            </div>
  
            <section class="community-related">
              <h2>相关文件</h2>
              <div class="community-related-grid" data-community-related></div>
            </section>
  
            <div class="community-detail-footer">
              <button type="button" data-community-action="基于文件提问">基于文件提问</button>
              <button type="button" data-community-action="发起深度研究">发起深度研究</button>
              <button type="button" data-community-action="发起社科智审">发起社科智审</button>
              <button type="button" data-community-action="在精读工具中打开">在精读工具中打开</button>
            </div>
          </section>
      </section>
    </main>

  </div>
  <div class="community-modal-mask" data-community-modal-mask hidden></div>
  <section class="community-modal" data-community-share-modal role="dialog" aria-modal="true" aria-labelledby="communityShareTitle" hidden>
    <div class="community-modal-head">
      <div>
        <h2 id="communityShareTitle">共享文件</h2>
        <p>一次只能共享一个文件，提交后进入审核</p>
      </div>
      <button class="community-modal-close" type="button" data-community-modal-close aria-label="关闭"><span data-icon="x"></span></button>
    </div>
    <form class="community-share-form" data-community-share-form>
      <label class="community-field" data-community-local-upload>
        <span>选择本地文件</span>
        <input type="file" accept=".pdf,.txt,.md,.doc,.docx" data-community-share-file>
      </label>
      <label class="community-field">
        <span>文件名</span>
        <input type="text" maxlength="80" required data-community-share-name>
      </label>
      <label class="community-field">
        <span>简短说明</span>
        <textarea rows="3" maxlength="180" data-community-share-description></textarea>
      </label>
      <div class="community-form-grid">
        <label class="community-field">
          <span>主题分类</span>
          <select data-community-share-topic>
            <option>政策研究</option>
            <option>基层治理</option>
            <option>区域发展</option>
            <option>文化传播</option>
            <option>社会治理</option>
            <option>成果案例</option>
          </select>
        </label>
        <label class="community-field">
          <span>发布范围</span>
          <select data-community-share-scope>
            <option>联盟公开</option>
          </select>
        </label>
      </div>
      <p class="community-review-note">提交后需经审核，审核通过后才会在共享社区公开。</p>
      <div class="community-modal-actions">
        <button class="btn btn-outline" type="button" data-community-modal-close>取消</button>
        <button class="btn btn-primary" type="submit">提交审核</button>
      </div>
    </form>
  </section>

  <script src="../assets/js/icons.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/shared-community.js" defer></script>
  <script src="../assets/js/pages/workbench.js" defer></script>
</body>
